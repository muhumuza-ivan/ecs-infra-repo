AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate cluster, task definition, service, and CPU auto scaling

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
  EcsTaskSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  EcrRepositoryUri:
    Type: String
  TargetGroupBlueArn:
    Type: String

Resources:
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: lab-app-cluster

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/lab-app
      RetentionInDays: 14

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      RoleName: lab-app-execution-role
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      RoleName: lab-app-task-role

  # BOOTSTRAP ONLY - do not add or change container properties here.
  #
  # This revision exists so the service can be created before any deployment
  # has run. From the first CodeDeploy deployment onward the service runs a
  # revision registered from the app repo's taskdef.json, and that file is the
  # only place container settings (image, ports, health check, logging) should
  # be edited.
  #
  # Editing this resource registers a new revision, which makes CloudFormation
  # try to repoint EcsService at it - and ECS rejects that outright for a
  # service with a CODE_DEPLOY deployment controller ("Unable to update task
  # definition on services with a CODE_DEPLOY deployment controller"), failing
  # the whole nested stack.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: lab-app
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: lab-app
          Image: !Sub "${EcrRepositoryUri}:latest"
          PortMappings:
            - ContainerPort: 8080
          # No HealthCheck here on purpose - see the note above. The container
          # health check that fixes the UNKNOWN health status lives in the app
          # repo's taskdef.json, which is the definition CodeDeploy actually
          # registers and runs.
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  EcsService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref EcsCluster
      DesiredCount: 1
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DeploymentController:
        Type: CODE_DEPLOY
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PrivateSubnet1Id, !Ref PrivateSubnet2Id]
          SecurityGroups: [!Ref EcsTaskSecurityGroupId]
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: lab-app
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroupBlueArn

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub service/${EcsCluster}/${EcsService.Name}
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: 1
      MaxCapacity: 4
      RoleARN: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: cpu-target-tracking
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 50.0
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

Outputs:
  ClusterName:
    Value: !Ref EcsCluster
  ServiceName:
    Value: !GetAtt EcsService.Name