AWSTemplateFormatVersion: "2010-09-09"
Description: IAM role GitHub Actions assumes via the account's existing OIDC provider to push to ECR

Parameters:
  GitHubOrg:
    Type: String
  AppRepoName:
    Type: String
  EcrRepositoryName:
    Type: String
  GitHubOidcProviderArn:
    Type: String
    Description: ARN of the existing GitHub OIDC provider in this account

Resources:
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lab-app-github-actions-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrg}/${AppRepoName}:ref:refs/heads/main"
                  - !Sub "repo:${GitHubOrg}@*/${AppRepoName}@*:ref:refs/heads/main"
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}
        # The app repo's workflow also uploads app-config.zip (appspec.yaml +
        # taskdef.json) to the artifact bucket, which is the pipeline's
        # AppSource. Scoped to that one key prefix - not the whole bucket, which
        # also holds nested templates and CodePipeline's own artifact store.
        - PolicyName: app-config-upload
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::lab-app-artifacts-${AWS::AccountId}-${AWS::Region}/app-config/*

Outputs:
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsRole.Arn