name: Deploy Infrastructure

# Runs the same, fixed sequence on every push - no first-run detection logic
# anywhere. Every step below is `aws cloudformation deploy`, which is
# idempotent by design: it creates a stack if it doesn't exist, updates it if
# the template changed, and safely no-ops (via --no-fail-on-empty-changeset)
# if nothing changed. That built-in state comparison is the only "have we
# bootstrapped yet" check this needs.
#
# Prerequisite (one-time, per AWS account): scripts/bootstrap-trust.sh has
# been run locally, and AWS_ACCOUNT_ID / GITHUB_CONNECTION_ARN repo variables
# are set. See scripts/bootstrap-trust.sh for details.

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/lab-app-infra-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # Foundation layer - rarely changes after the first run, but safe to
      # run every time.
      - name: Deploy artifact bucket
        run: |
          aws cloudformation deploy \
            --stack-name lab-app-artifact-bucket \
            --template-file templates/artifact-bucket.yaml \
            --no-fail-on-empty-changeset

      - name: Sync templates to S3
        run: |
          aws s3 sync templates/ s3://lab-app-artifacts-${{ vars.AWS_ACCOUNT_ID }}-${{ env.AWS_REGION }}/templates/ --delete

      - name: Deploy ECR repository
        run: |
          aws cloudformation deploy \
            --stack-name lab-app-ecr \
            --template-file templates/ecr.yaml \
            --no-fail-on-empty-changeset

      - name: Deploy SSM parameters
        run: |
          aws cloudformation deploy \
            --stack-name lab-app-ssm-parameters \
            --template-file templates/ssm-parameters.yaml \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ArtifactBucketName=lab-app-artifacts-${{ vars.AWS_ACCOUNT_ID }}-${{ env.AWS_REGION }} \
              GitHubOrgName=${{ github.repository_owner }} \
              AppRepoNameValue=ecs-app-repo \
              GitHubConnectionArnValue=${{ vars.GITHUB_CONNECTION_ARN }}

      # Workload layer - this is the one that changes on essentially every
      # real commit once the account is bootstrapped: VPC, ALB, ECS, Auto
      # Scaling, CodePipeline, CodeDeploy, EventBridge.
      - name: Deploy main stack
        run: |
          aws cloudformation deploy \
            --stack-name lab-app-stack \
            --template-file templates/main.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Print ALB endpoint
        run: |
          aws cloudformation describe-stacks --stack-name lab-app-stack \
            --query "Stacks[0].Outputs" --output table
