name: Deploy Infrastructure

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  APP_REPO_NAME: ecs-app-repo
  ECR_REPOSITORY: lab-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The ONLY stack deployed outside main.yaml. It cannot be nested: the
      # packaging step below uploads main.yaml's child templates *into* this
      # bucket, so it has to exist before packaging runs. Everything else -
      # ECR, the app repo's OIDC role, the SSM parameters, and the whole
      # VPC/ALB/ECS/pipeline tree - is declared in main.yaml and created by the
      # single deploy step at the end.
      - name: Deploy artifact bucket
        run: |
          aws cloudformation deploy \
            --stack-name lab-app-artifact-bucket \
            --template-file templates/artifact-bucket.yaml \
            --no-fail-on-empty-changeset

      # Uploads every nested child template referenced by main.yaml to the
      # artifact bucket and emits a copy of main.yaml with the local paths
      # rewritten to those S3 URLs. Keys are content-hashed, so an unchanged
      # child template re-resolves to the same object and the nested stack
      # reports no changes.
      - name: Package nested templates
        run: |
          aws cloudformation package \
            --template-file main.yaml \
            --s3-bucket "lab-app-artifacts-${{ steps.aws.outputs.aws-account-id }}-${{ env.AWS_REGION }}" \
            --s3-prefix templates \
            --output-template-file packaged-main.yaml

      # Deploys the whole tree from the packaged template: ECR, the app repo's
      # OIDC role, SSM parameters, VPC, ALB, ECS, Auto Scaling, CodePipeline,
      # CodeDeploy and the EventBridge rule.
      - name: Deploy main stack
        run: |
          aws cloudformation deploy \
            --stack-name lab-app-stack \
            --template-file packaged-main.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ArtifactBucketName="lab-app-artifacts-${{ steps.aws.outputs.aws-account-id }}-${{ env.AWS_REGION }}" \
              GitHubOrg=${{ github.repository_owner }} \
              AppRepoName="${APP_REPO_NAME}" \
              EcrRepositoryName="${ECR_REPOSITORY}" \
              GitHubOidcProviderArn="arn:aws:iam::${{ steps.aws.outputs.aws-account-id }}:oidc-provider/token.actions.githubusercontent.com"

      - name: Print ALB endpoint
        run: |
          aws cloudformation describe-stacks --stack-name lab-app-stack \
            --query "Stacks[0].Outputs" --output table
