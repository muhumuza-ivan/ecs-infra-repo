name: Deploy Infrastructure

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  APP_REPO_NAME: ecs-app-repo
  ECR_REPOSITORY: lab-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve account-scoped names
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "ARTIFACT_BUCKET=lab-app-artifacts-${ACCOUNT_ID}-${AWS_REGION}" >> "$GITHUB_ENV"
          echo "OIDC_PROVIDER_ARN=arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com" >> "$GITHUB_ENV"

      # Foundation layer - rarely changes after the first run, but safe to
      # run every time.
      - name: Deploy artifact bucket
        run: |
          aws cloudformation deploy \
            --stack-name lab-app-artifact-bucket \
            --template-file templates/artifact-bucket.yaml \
            --no-fail-on-empty-changeset

      - name: Deploy ECR repository
        run: |
          aws cloudformation deploy \
            --stack-name lab-app-ecr \
            --template-file templates/ecr.yaml \
            --no-fail-on-empty-changeset

      # The role the app repo's workflow assumes: ECR push, plus writing
      # app-config.zip (appspec.yaml + taskdef.json) into the artifact bucket.
      - name: Deploy app repo GitHub Actions role
        run: |
          aws cloudformation deploy \
            --stack-name lab-app-github-actions-role \
            --template-file templates/oidc-github.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              GitHubOrg=${{ github.repository_owner }} \
              AppRepoName="${APP_REPO_NAME}" \
              EcrRepositoryName="${ECR_REPOSITORY}" \
              GitHubOidcProviderArn="${OIDC_PROVIDER_ARN}"

      - name: Deploy SSM parameters
        run: |
          aws cloudformation deploy \
            --stack-name lab-app-ssm-parameters \
            --template-file templates/ssm-parameters.yaml \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ArtifactBucketName="${ARTIFACT_BUCKET}" \
              GitHubOrgName=${{ github.repository_owner }} \
              AppRepoNameValue="${APP_REPO_NAME}"

      # Uploads every nested child template referenced by main.yaml to the
      # artifact bucket and emits a copy of main.yaml with the local paths
      # rewritten to those S3 URLs. Keys are content-hashed, so an unchanged
      # child template re-resolves to the same object and the nested stack
      # reports no changes.
      - name: Package nested templates
        run: |
          aws cloudformation package \
            --template-file main.yaml \
            --s3-bucket "${ARTIFACT_BUCKET}" \
            --s3-prefix templates \
            --output-template-file packaged-main.yaml

      # Workload layer - this is the one that changes on essentially every
      # real commit once the account is bootstrapped: VPC, ALB, ECS, Auto
      # Scaling, CodePipeline, CodeDeploy, EventBridge.
      - name: Deploy main stack
        run: |
          aws cloudformation deploy \
            --stack-name lab-app-stack \
            --template-file packaged-main.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Print ALB endpoint
        run: |
          aws cloudformation describe-stacks --stack-name lab-app-stack \
            --query "Stacks[0].Outputs" --output table
